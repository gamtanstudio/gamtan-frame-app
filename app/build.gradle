plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gamtan.frame'
    compileSdk 34

    defaultConfig {
        applicationId "com.gamtan.frame"
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName "1.6"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
